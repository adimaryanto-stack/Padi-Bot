<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PadiBot - Smart Rice Planter</title>
  <!-- Tailwind CSS & React 18 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8FAFC;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }
    .pulse-glow {
      animation: pulseGlow 1.5s infinite;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 flex justify-center items-center min-h-screen p-0 sm:p-4">
  <div id="root" class="w-full max-w-md bg-[#F8FAFC] min-h-screen sm:min-h-[880px] sm:h-[880px] sm:rounded-[36px] shadow-2xl overflow-hidden flex flex-col relative border border-slate-200"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Mock Fields & Route Patterns ---
    const INITIAL_FIELDS = [
      {
        id: 'f1',
        name: 'Sawah Utama Karawang',
        areaM2: 1722,
        perimeterM: 168.4,
        boundary: [
          { lat: -6.923400, lon: 107.610000 },
          { lat: -6.923380, lon: 107.610420 },
          { lat: -6.923720, lon: 107.610440 },
          { lat: -6.923740, lon: 107.610020 }
        ]
      },
      {
        id: 'f2',
        name: 'Sawah Blok Timur',
        areaM2: 890,
        perimeterM: 122.0,
        boundary: [
          { lat: -6.923200, lon: 107.610100 },
          { lat: -6.923250, lon: 107.610450 },
          { lat: -6.923550, lon: 107.610450 },
          { lat: -6.923500, lon: 107.610100 }
        ]
      }
    ];

    const PATTERNS = [
      {
        id: 'BOUSTROPHEDON',
        title: '1. Persegi Panjang / Zig-Zag',
        desc: 'Pola bolak-balik paralel standar paling efisien untuk petakan kotak',
        emoji: '⚡'
      },
      {
        id: 'HEADLAND_INNER',
        title: '2. Dengan Headland (Area Putar)',
        desc: 'Tanam area tengah terlebih dahulu, sisakan putaran di keliling pematang',
        emoji: '🔄'
      },
      {
        id: 'SPIRAL_INWARD',
        title: '3. Oval / Spiral (Pinggir ke Tengah)',
        desc: 'Memutar mengelilingi batas sawah dari luar menuju titik tengah',
        emoji: '🌀'
      },
      {
        id: 'SPIRAL_OUTWARD',
        title: '4. Oval / Spiral (Tengah ke Pinggir)',
        desc: 'Mulai dari pusat tengah sawah memutar membesar ke arah luar',
        emoji: '💫'
      }
    ];

    // Generate waypoints based on pattern for live simulation
    function generateSimWaypoints(pattern) {
      if (pattern === 'SPIRAL_INWARD') {
        return [
          { x: 50, y: 50, heading: 0 },
          { x: 270, y: 50, heading: 90 },
          { x: 270, y: 170, heading: 180 },
          { x: 50, y: 170, heading: 270 },
          { x: 75, y: 75, heading: 0 },
          { x: 245, y: 75, heading: 90 },
          { x: 245, y: 145, heading: 180 },
          { x: 75, y: 145, heading: 270 },
          { x: 100, y: 100, heading: 0 },
          { x: 220, y: 100, heading: 90 },
          { x: 220, y: 120, heading: 180 },
          { x: 160, y: 110, heading: 0 }
        ];
      } else if (pattern === 'HEADLAND_INNER') {
        return [
          { x: 60, y: 70, heading: 0 },
          { x: 250, y: 70, heading: 90 },
          { x: 250, y: 95, heading: 180 },
          { x: 60, y: 95, heading: 270 },
          { x: 60, y: 120, heading: 0 },
          { x: 250, y: 120, heading: 90 },
          { x: 250, y: 145, heading: 180 },
          { x: 60, y: 145, heading: 270 },
          { x: 45, y: 45, heading: 0 },
          { x: 275, y: 45, heading: 90 },
          { x: 275, y: 175, heading: 180 },
          { x: 45, y: 175, heading: 270 }
        ];
      } else {
        // Boustrophedon (default)
        return [
          { x: 60, y: 60, heading: 0 },
          { x: 260, y: 60, heading: 90 },
          { x: 260, y: 85, heading: 180 },
          { x: 60, y: 85, heading: 270 },
          { x: 60, y: 110, heading: 0 },
          { x: 260, y: 110, heading: 90 },
          { x: 260, y: 135, heading: 180 },
          { x: 60, y: 135, heading: 270 },
          { x: 60, y: 160, heading: 0 },
          { x: 260, y: 160, heading: 90 }
        ];
      }
    }

    function App() {
      const [currentScreen, setCurrentScreen] = useState('DASHBOARD');
      const [fields, setFields] = useState(INITIAL_FIELDS);
      const [selectedFieldId, setSelectedFieldId] = useState('f1');
      const [pattern, setPattern] = useState('BOUSTROPHEDON');
      const [machineWidth, setMachineWidth] = useState(1.5);
      const [headlandWidth, setHeadlandWidth] = useState(3.0);
      const [orientationDeg, setOrientationDeg] = useState(0);

      const [connectionMode, setConnectionMode] = useState('SIMULATOR');
      const [simSpeedMps, setSimSpeedMps] = useState(0.8);
      const [telemetry, setTelemetry] = useState({
        battery: 92,
        speed: 0.00,
        gpsStatus: 'GPS RTK',
        accuracy: 1.2,
        lat: -6.923500,
        lon: 107.610200,
        progress: 0,
        currentLane: 1,
        totalLanes: 18,
        areaDone: 0,
        areaRemaining: 1722,
        posX: 60,
        posY: 60,
        heading: 0,
        waypointIdx: 0,
        trail: []
      });

      const [isMissionRunning, setIsMissionRunning] = useState(false);
      const [isPaused, setIsPaused] = useState(false);
      const [manualSpeed, setManualSpeed] = useState(50);
      const [newFieldName, setNewFieldName] = useState('');
      const [newFieldPoints, setNewFieldPoints] = useState([
        { lat: -6.923400, lon: 107.610000 },
        { lat: -6.923380, lon: 107.610420 },
        { lat: -6.923720, lon: 107.610440 },
        { lat: -6.923740, lon: 107.610020 }
      ]);
      const [walkMapActive, setWalkMapActive] = useState(false);

      const activeField = useMemo(() => {
        return fields.find(f => f.id === selectedFieldId) || fields[0];
      }, [fields, selectedFieldId]);

      const simWaypoints = useMemo(() => generateSimWaypoints(pattern), [pattern]);

      // Real-time Physics & Simulator Animation Loop
      useEffect(() => {
        let timer;
        if (isMissionRunning && !isPaused) {
          timer = setInterval(() => {
            setTelemetry(prev => {
              const pts = simWaypoints;
              const target = pts[prev.waypointIdx % pts.length];
              const dx = target.x - prev.posX;
              const dy = target.y - prev.posY;
              const dist = Math.sqrt(dx * dx + dy * dy);

              let nextX = prev.posX;
              let nextY = prev.posY;
              let nextWp = prev.waypointIdx;
              let nextHeading = prev.heading;

              const step = 4.0; // animation step
              if (dist <= step) {
                nextX = target.x;
                nextY = target.y;
                nextWp = (prev.waypointIdx + 1);
                if (nextWp >= pts.length) {
                  setIsMissionRunning(false);
                }
              } else {
                nextX += (dx / dist) * step;
                nextY += (dy / dist) * step;
                nextHeading = Math.atan2(dy, dx) * (180 / Math.PI);
              }

              const newProgress = Math.min(100, Math.round((nextWp / pts.length) * 100));
              const done = Math.round((newProgress / 100) * (activeField.areaM2 || 1722));
              const rem = Math.max(0, (activeField.areaM2 || 1722) - done);
              const curLane = Math.min(prev.totalLanes, Math.floor((newProgress / 100) * prev.totalLanes) + 1);

              return {
                ...prev,
                posX: nextX,
                posY: nextY,
                heading: nextHeading,
                waypointIdx: nextWp,
                progress: newProgress,
                speed: simSpeedMps,
                battery: Math.max(12, prev.battery - 0.03),
                currentLane: curLane,
                areaDone: done,
                areaRemaining: rem,
                trail: [...prev.trail.slice(-80), { x: nextX, y: nextY }]
              };
            });
          }, 150);
        } else if (!isMissionRunning) {
          setTelemetry(prev => ({ ...prev, speed: 0.00 }));
        }
        return () => clearInterval(timer);
      }, [isMissionRunning, isPaused, simWaypoints, activeField, simSpeedMps]);

      const resetSimulation = () => {
        setIsMissionRunning(false);
        setIsPaused(false);
        setTelemetry(prev => ({
          ...prev,
          progress: 0,
          areaDone: 0,
          areaRemaining: activeField.areaM2,
          currentLane: 1,
          speed: 0,
          posX: simWaypoints[0].x,
          posY: simWaypoints[0].y,
          heading: simWaypoints[0].heading,
          waypointIdx: 0,
          trail: []
        }));
      };

      return (
        <div className="flex flex-col h-full bg-[#F8FAFC] relative select-none">
          {/* Main Content Area */}
          <div className="flex-1 overflow-y-auto hide-scrollbar pb-20">
            {currentScreen === 'DASHBOARD' && (
              <DashboardView
                activeField={activeField}
                fields={fields}
                telemetry={telemetry}
                onStartMission={() => setCurrentScreen('PLANTING_SETTINGS')}
                onOpenSimulator={() => {
                  resetSimulation();
                  setCurrentScreen('SIMULATOR_SCREEN');
                }}
                onManualControl={() => setCurrentScreen('MANUAL_CONTROL')}
                onOpenFields={() => setCurrentScreen('FIELD_LIST')}
                onSelectFieldId={setSelectedFieldId}
              />
            )}

            {currentScreen === 'PLANTING_SETTINGS' && (
              <PlantingSettingsView
                activeField={activeField}
                fields={fields}
                selectedFieldId={selectedFieldId}
                setSelectedFieldId={setSelectedFieldId}
                pattern={pattern}
                setPattern={setPattern}
                machineWidth={machineWidth}
                setMachineWidth={setMachineWidth}
                headlandWidth={headlandWidth}
                setHeadlandWidth={setHeadlandWidth}
                orientationDeg={orientationDeg}
                setOrientationDeg={setOrientationDeg}
                onNext={() => setCurrentScreen('ROUTE_PREVIEW')}
                onBack={() => setCurrentScreen('DASHBOARD')}
              />
            )}

            {currentScreen === 'ROUTE_PREVIEW' && (
              <RoutePreviewView
                activeField={activeField}
                pattern={pattern}
                machineWidth={machineWidth}
                headlandWidth={headlandWidth}
                orientationDeg={orientationDeg}
                onApprove={() => {
                  resetSimulation();
                  setIsMissionRunning(true);
                  setCurrentScreen('EXECUTION');
                }}
                onBack={() => setCurrentScreen('PLANTING_SETTINGS')}
              />
            )}

            {currentScreen === 'EXECUTION' && (
              <ExecutionView
                activeField={activeField}
                pattern={pattern}
                telemetry={telemetry}
                isMissionRunning={isMissionRunning}
                isPaused={isPaused}
                simWaypoints={simWaypoints}
                onPause={() => setIsPaused(true)}
                onResume={() => setIsPaused(false)}
                onStop={() => {
                  setIsMissionRunning(false);
                  setCurrentScreen('DASHBOARD');
                }}
                onEmergencyStop={() => {
                  setIsMissionRunning(false);
                  alert('⚠️ BERHENTI DARURAT DIAKTIFKAN!');
                  setCurrentScreen('DASHBOARD');
                }}
                onBack={() => setCurrentScreen('DASHBOARD')}
              />
            )}

            {currentScreen === 'SIMULATOR_SCREEN' && (
              <SimulatorScreenView
                activeField={activeField}
                pattern={pattern}
                setPattern={setPattern}
                telemetry={telemetry}
                isMissionRunning={isMissionRunning}
                isPaused={isPaused}
                simWaypoints={simWaypoints}
                simSpeedMps={simSpeedMps}
                setSimSpeedMps={setSimSpeedMps}
                onStart={() => {
                  setIsMissionRunning(true);
                  setIsPaused(false);
                }}
                onPause={() => setIsPaused(true)}
                onResume={() => setIsPaused(false)}
                onReset={resetSimulation}
                onClose={() => setCurrentScreen('DASHBOARD')}
              />
            )}

            {currentScreen === 'MANUAL_CONTROL' && (
              <ManualControlView
                telemetry={telemetry}
                manualSpeed={manualSpeed}
                setManualSpeed={setManualSpeed}
                onClose={() => setCurrentScreen('DASHBOARD')}
              />
            )}

            {currentScreen === 'FIELD_LIST' && (
              <FieldListView
                fields={fields}
                selectedFieldId={selectedFieldId}
                onSelect={(id) => {
                  setSelectedFieldId(id);
                  setCurrentScreen('DASHBOARD');
                }}
                onAddNew={() => setCurrentScreen('FIELD_CREATE')}
                onBack={() => setCurrentScreen('DASHBOARD')}
              />
            )}

            {currentScreen === 'FIELD_CREATE' && (
              <FieldCreateView
                fieldName={newFieldName}
                setFieldName={setNewFieldName}
                points={newFieldPoints}
                setPoints={setNewFieldPoints}
                walkMapActive={walkMapActive}
                setWalkMapActive={setWalkMapActive}
                telemetry={telemetry}
                onSave={(field) => {
                  setFields(prev => [field, ...prev]);
                  setSelectedFieldId(field.id);
                  setCurrentScreen('DASHBOARD');
                }}
                onBack={() => setCurrentScreen('FIELD_LIST')}
              />
            )}

            {currentScreen === 'HISTORY' && (
              <HistoryView onBack={() => setCurrentScreen('DASHBOARD')} />
            )}

            {currentScreen === 'SETTINGS' && (
              <SettingsView
                connectionMode={connectionMode}
                setConnectionMode={setConnectionMode}
                onBack={() => setCurrentScreen('DASHBOARD')}
              />
            )}
          </div>

          {/* Bottom Navigation Bar */}
          {['DASHBOARD', 'FIELD_LIST', 'HISTORY', 'SETTINGS'].includes(currentScreen) && (
            <div className="absolute bottom-0 inset-x-0 bg-white border-t border-slate-200 px-6 py-2.5 flex justify-between items-center z-30 shadow-lg">
              <button
                onClick={() => setCurrentScreen('DASHBOARD')}
                className={`flex flex-col items-center gap-1 ${currentScreen === 'DASHBOARD' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
              >
                <span className="text-xl">🏠</span>
                <span className="text-[11px]">Beranda</span>
              </button>
              <button
                onClick={() => setCurrentScreen('FIELD_LIST')}
                className={`flex flex-col items-center gap-1 ${currentScreen === 'FIELD_LIST' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
              >
                <span className="text-xl">🌾</span>
                <span className="text-[11px]">Pemetaan</span>
              </button>
              <button
                onClick={() => setCurrentScreen('HISTORY')}
                className={`flex flex-col items-center gap-1 ${currentScreen === 'HISTORY' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
              >
                <span className="text-xl">📊</span>
                <span className="text-[11px]">Laporan</span>
              </button>
              <button
                onClick={() => setCurrentScreen('SETTINGS')}
                className={`flex flex-col items-center gap-1 ${currentScreen === 'SETTINGS' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
              >
                <span className="text-xl">⚙️</span>
                <span className="text-[11px]">Pengaturan</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    // --- SCREEN 1: DASHBOARD VIEW ---
    function DashboardView({ activeField, fields, telemetry, onStartMission, onOpenSimulator, onManualControl, onOpenFields, onSelectFieldId }) {
      return (
        <div className="p-4 space-y-4">
          {/* Top Header */}
          <div className="flex justify-between items-center pt-2">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">PadiBot</h1>
              <p className="text-xs text-slate-500">Tanam Cerdas, Panen Lebih 🌾</p>
            </div>
            <button
              onClick={onOpenSimulator}
              className="flex items-center gap-1.5 px-3 py-1 bg-emerald-100 border border-emerald-300 rounded-full text-emerald-800 text-xs font-semibold hover:bg-emerald-200 transition-all cursor-pointer"
            >
              <span className="w-2 h-2 rounded-full bg-emerald-500 pulse-glow"></span>
              <span>🧪 Buka Simulator</span>
            </button>
          </div>

          {/* Hero Banner */}
          <div className="relative rounded-2xl overflow-hidden shadow-sm border border-slate-200 aspect-[16/8]">
            <img
              src="https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=800&q=80"
              alt="Rice Field Banner"
              className="w-full h-full object-cover"
            />
            <div className="absolute inset-0 bg-gradient-to-t from-black/75 via-black/25 to-transparent flex flex-col justify-end p-4 text-white">
              <h2 className="text-lg font-bold">PadiBot Smart Planter</h2>
              <p className="text-xs text-slate-200">Presisi Penanaman Bibit Padi Otomatis & Efisien</p>
            </div>
          </div>

          {/* Status Mesin Tanam Card */}
          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-slate-800 text-sm">Status Mesin Tanam</h3>
              <span className="px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold font-mono">
                {telemetry.gpsStatus} (±{telemetry.accuracy}m)
              </span>
            </div>

            <div className="grid grid-cols-3 gap-2 pt-1">
              <div className="bg-slate-50 rounded-xl p-3 border border-slate-100 text-center">
                <span className="text-lg text-emerald-600 block">🔋</span>
                <span className="text-base font-extrabold text-slate-900 block mt-0.5">{telemetry.battery.toFixed(0)}%</span>
                <span className="text-[10px] text-slate-500">Baterai Mesin</span>
              </div>
              <div className="bg-slate-50 rounded-xl p-3 border border-slate-100 text-center">
                <span className="text-lg text-sky-600 block">⚡</span>
                <span className="text-base font-extrabold text-slate-900 block mt-0.5">{telemetry.speed.toFixed(2)} m/s</span>
                <span className="text-[10px] text-slate-500">Kecepatan</span>
              </div>
              <div className="bg-slate-50 rounded-xl p-3 border border-slate-100 text-center">
                <span className="text-lg text-amber-600 block">📶</span>
                <span className="text-base font-extrabold text-slate-900 block mt-0.5">Simulator</span>
                <span className="text-[10px] text-slate-500">Mode Komunikasi</span>
              </div>
            </div>
          </div>

          {/* Sawah Aktif Card */}
          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-1.5 text-xs text-slate-500 font-semibold">
                <span>🌾</span>
                <span>Sawah Aktif</span>
              </div>
              <button onClick={onOpenFields} className="text-xs font-bold text-emerald-600 hover:text-emerald-700">
                Ganti Sawah →
              </button>
            </div>

            <div>
              <h4 className="text-base font-extrabold text-slate-900">{activeField.name}</h4>
              <p className="text-xs text-slate-500 mt-0.5">
                📐 Luas: <span className="font-bold text-emerald-700">{activeField.areaM2} m²</span> • 📍 {activeField.boundary.length} Titik Batas
              </p>
            </div>

            {/* Map Preview Graphic */}
            <div className="relative bg-[#1E2D1E] rounded-xl overflow-hidden h-36 border border-emerald-900/30 flex items-center justify-center p-3">
              <svg viewBox="0 0 300 140" className="w-full h-full">
                <polygon points="40,20 260,30 240,120 60,110" fill="#00E676" fillOpacity="0.2" stroke="#00E676" strokeWidth="2.5" />
                <line x1="60" y1="45" x2="240" y2="48" stroke="#00E676" strokeWidth="1.5" strokeDasharray="3 3" />
                <line x1="60" y1="70" x2="240" y2="73" stroke="#00E676" strokeWidth="1.5" strokeDasharray="3 3" />
                <line x1="60" y1="95" x2="240" y2="98" stroke="#00E676" strokeWidth="1.5" strokeDasharray="3 3" />
                <circle cx="40" cy="20" r="5" fill="#10B981" />
                <text x="48" y="24" fill="#FFFFFF" fontSize="9" fontWeight="bold">START</text>
                <circle cx="60" cy="110" r="5" fill="#EF4444" />
                <text x="68" y="114" fill="#FFFFFF" fontSize="9" fontWeight="bold">END</text>
              </svg>
            </div>
          </div>

          {/* Big Green Start Mission Button */}
          <button
            onClick={onStartMission}
            className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-extrabold text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/25 active:scale-[0.99] transition-all"
          >
            <span>🌾</span>
            <span>MULAI MISI BARU</span>
          </button>

          {/* Quick Actions */}
          <div className="grid grid-cols-2 gap-3">
            <button
              onClick={onManualControl}
              className="py-3 bg-white hover:bg-slate-50 border border-slate-200 text-slate-800 rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-sm"
            >
              <span>🕹️</span>
              <span>Kontrol Manual</span>
            </button>
            <button
              onClick={onOpenFields}
              className="py-3 bg-white hover:bg-slate-50 border border-slate-200 text-slate-800 rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-sm"
            >
              <span>🗺️</span>
              <span>Peta Sawah</span>
            </button>
          </div>
        </div>
      );
    }

    // --- SCREEN: DEDICATED LIVE SIMULATOR (MATCHING BLOG SPOT) ---
    function SimulatorScreenView({
      activeField, pattern, setPattern, telemetry, isMissionRunning, isPaused,
      simWaypoints, simSpeedMps, setSimSpeedMps, onStart, onPause, onResume, onReset, onClose
    }) {
      return (
        <div className="p-4 space-y-4">
          <div className="flex justify-between items-center pt-2">
            <div>
              <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">
                🧪 SIMULATOR LIVE 2026
              </span>
              <h1 className="text-xl font-extrabold text-slate-900 mt-1">Uji Coba Lintasan PadiBot</h1>
            </div>

        <div className="p-4 space-y-4">
          <div className="flex items-center gap-3 pt-2">
            <button onClick={onBack} className="w-8 h-8 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 font-bold">←</button>
            <div>
              <h1 className="text-xl font-extrabold text-slate-900">Tambah Sawah Baru</h1>
              <p className="text-xs text-slate-500">Pemetaan Batas Koordinat GPS</p>
            </div>
          </div>
          <div className="space-y-3">
            <input type="text" placeholder="Nama Sawah (Contoh: Sawah Blok Barat)" value={fieldName} onChange={e => setFieldName(e.target.value)} className="w-full p-3.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:border-emerald-600" />
            <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
              <div className="flex justify-between items-center">
                <span className="font-bold text-slate-800 text-xs flex items-center gap-1">📍 Lokasi GPS Terkini</span>
                <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded">±1.2m Akurat</span>
              </div>
              <p className="text-xs font-mono text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100">Lat: {telemetry.lat.toFixed(6)}, Lon: {telemetry.lon.toFixed(6)}</p>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => setPoints(prev => [...prev, { lat: telemetry.lat, lon: telemetry.lon }])} className="py-2.5 bg-emerald-600 text-white rounded-xl font-bold text-xs">+ Titik GPS Terkini</button>
                <button onClick={() => setWalkMapActive(!walkMapActive)} className={`py-2.5 border rounded-xl font-bold text-xs ${walkMapActive ? 'bg-emerald-100 border-emerald-600 text-emerald-800' : 'bg-white border-slate-200 text-slate-700'}`}>{walkMapActive ? '🚶 Selesai Rekam' : '🚶 Walk & Map'}</button>
              </div>
            </div>
            <button onClick={() => { if (!fieldName.trim()) return alert('Nama sawah wajib diisi!'); onSave({ id: 'f_' + Date.now(), name: fieldName, areaM2: 1250, perimeterM: 140.0, boundary: points }); }} className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-extrabold text-base shadow-md">Simpan Sawah</button>
          </div>
        </div>
      );
    }

    function HistoryView({ onBack }) {
      return (
        <div className="p-4 space-y-4">
          <h1 className="text-xl font-extrabold text-slate-900 pt-2">Riwayat Misi & Laporan</h1>
          <div className="space-y-3">
            <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-1">
              <div className="flex justify-between">
                <span className="font-bold text-slate-800 text-sm">Misi Sawah Karawang #27</span>
                <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded">SELESAI</span>
              </div>
              <p className="text-xs text-slate-500">27 Agustus 2026 • 1,722 m² tertanam (98%)</p>
            </div>
          </div>
        </div>
      );
    }

    function SettingsView({ connectionMode, setConnectionMode, onBack }) {
      return (
        <div className="p-4 space-y-4">
          <h1 className="text-xl font-extrabold text-slate-900 pt-2">Pengaturan Aplikasi</h1>
          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2">
            <h3 className="font-bold text-slate-800 text-sm">Tema Tampilan Aplikasi</h3>
            <div className="grid grid-cols-2 gap-2 pt-1">
              <div className="p-3 rounded-xl border-2 border-emerald-600 bg-emerald-50 text-center">
                <span className="text-xl block">🌞</span>
                <span className="text-xs font-bold text-emerald-900 block mt-1">Versi Light</span>
                <span className="text-[10px] text-emerald-700 font-semibold">Aktif (Default)</span>
              </div>
              <div className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-center opacity-60">
                <span className="text-xl block">🌙</span>
                <span className="text-xs font-bold text-slate-700 block mt-1">Versi Dark</span>
                <span className="text-[10px] text-slate-500">Mode Malam</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
