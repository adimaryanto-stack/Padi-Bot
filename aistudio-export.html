<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PadiBot - Smart Rice Planter App</title>
  <!-- Tailwind CSS & React CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f4f9f0',
              100: '#e6f2de',
              200: '#cfe5bf',
              300: '#aed297',
              400: '#8cba6f',
              500: '#689f48',
              600: '#518136',
              700: '#3f652c',
              800: '#355126',
              900: '#2d4422',
            },
            agriDark: '#172417',
            agriSurface: '#1E2D1E',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0d140d;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen text-slate-100 p-0 sm:p-4">
  <div id="root" class="w-full max-w-md bg-[#121c12] sm:rounded-3xl shadow-2xl overflow-hidden border border-emerald-900/50 flex flex-col min-h-screen sm:min-h-[844px] sm:max-h-[890px]"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── INITIAL DATA & GEOMETRY UTILITIES ──────────────────────────────
    const INITIAL_FIELDS = [
      {
        id: 'field-1',
        name: 'Sawah Utama',
        areaM2: 1240,
        perimeterM: 142,
        boundary: [
          { lat: -6.20000, lon: 106.81666 },
          { lat: -6.20035, lon: 106.81666 },
          { lat: -6.20035, lon: 106.81702 },
          { lat: -6.20000, lon: 106.81702 },
        ]
      },
      {
        id: 'field-2',
        name: 'Sawah Timur',
        areaM2: 2450,
        perimeterM: 198,
        boundary: [
          { lat: -6.20100, lon: 106.81800 },
          { lat: -6.20160, lon: 106.81810 },
          { lat: -6.20175, lon: 106.81860 },
          { lat: -6.20120, lon: 106.81870 },
          { lat: -6.20090, lon: 106.81830 },
        ]
      }
    ];

    // ── MAIN APP COMPONENT ─────────────────────────────────────────────
    function PadiBotApp() {
      const [screen, setScreen] = useState('dashboard'); // dashboard, fields, fieldCreate, settings, plantingSettings, routePreview, execution, manualControl, history
      const [fields, setFields] = useState(INITIAL_FIELDS);
      const [selectedFieldId, setSelectedFieldId] = useState('field-1');
      const [activeField, setActiveField] = useState(INITIAL_FIELDS[0]);

      // Mission parameters
      const [routePattern, setRoutePattern] = useState('BOUSTROPHEDON'); // BOUSTROPHEDON, HEADLAND_INNER, SPIRAL_INWARD, SPIRAL_OUTWARD
      const [rowSpacingCm, setRowSpacingCm] = useState(30);
      const [plantSpacingCm, setPlantSpacingCm] = useState(20);
      const [machineWidthCm, setMachineWidthCm] = useState(120);
      const [speedMps, setSpeedMps] = useState(0.8);
      const [headlandWidthM, setHeadlandWidthM] = useState(1.5);
      const [orientationDeg, setOrientationDeg] = useState(0);

      // Live Mission Execution State
      const [missionStatus, setMissionStatus] = useState('READY'); // READY, RUNNING, PAUSED, COMPLETED, STOPPED
      const [progressPct, setProgressPct] = useState(0);
      const [elapsedSec, setElapsedSec] = useState(0);
      const [tractorStep, setTractorStep] = useState(0);
      const [batteryPct, setBatteryPct] = useState(82);

      // Missions History
      const [missions, setMissions] = useState([
        {
          id: 'm-1',
          name: 'Misi Sawah Utama #27/8',
          fieldName: 'Sawah Utama',
          date: '27 Agu 2026, 08:15',
          duration: '1 jam 32 mnt',
          areaPlanted: '1.240 m²',
          coveragePct: 98,
          status: 'COMPLETED'
        }
      ]);

      // Keep active field updated
      useEffect(() => {
        const f = fields.find(item => item.id === selectedFieldId) || fields[0];
        setActiveField(f);
      }, [selectedFieldId, fields]);

      // Live Execution Timer and Tractor Simulation
      useEffect(() => {
        let interval = null;
        if (missionStatus === 'RUNNING') {
          interval = setInterval(() => {
            setElapsedSec(prev => prev + 1);
            setTractorStep(prev => prev + 1);
            setProgressPct(prev => {
              if (prev >= 100) {
                setMissionStatus('COMPLETED');
                return 100;
              }
              return Math.min(100, prev + 1);
            });
            if (elapsedSec % 60 === 0) {
              setBatteryPct(prev => Math.max(10, prev - 1));
            }
          }, 600);
        }
        return () => clearInterval(interval);
      }, [missionStatus, elapsedSec]);

      const formatTimer = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      // ── SCREEN ROUTER ────────────────────────────────────────────────
      return (
        <div className="flex flex-col h-full bg-[#121c12]">
          {/* Main Content Area */}
          <div className="flex-1 overflow-y-auto hide-scrollbar">
            {screen === 'dashboard' && (
              <DashboardScreen
                fields={fields}
                activeField={activeField}
                selectedFieldId={selectedFieldId}
                setSelectedFieldId={setSelectedFieldId}
                batteryPct={batteryPct}
                onStartMission={() => setScreen('plantingSettings')}
                onManualControl={() => setScreen('manualControl')}
                onViewHistory={() => setScreen('history')}
                onNavigate={(s) => setScreen(s)}
              />
            )}

            {screen === 'plantingSettings' && (
              <PlantingSettingsScreen
                fields={fields}
                selectedField={activeField}
                selectedFieldId={selectedFieldId}
                onSelectField={setSelectedFieldId}
                routePattern={routePattern}
                setRoutePattern={setRoutePattern}
                rowSpacingCm={rowSpacingCm}
                setRowSpacingCm={setRowSpacingCm}
                plantSpacingCm={plantSpacingCm}
                setPlantSpacingCm={setPlantSpacingCm}
                machineWidthCm={machineWidthCm}
                setMachineWidthCm={setMachineWidthCm}
                speedMps={speedMps}
                setSpeedMps={setSpeedMps}
                headlandWidthM={headlandWidthM}
                setHeadlandWidthM={setHeadlandWidthM}
                orientationDeg={orientationDeg}
                setOrientationDeg={setOrientationDeg}
                onGenerate={() => setScreen('routePreview')}
                onBack={() => setScreen('dashboard')}
              />
            )}

            {screen === 'routePreview' && (
              <RoutePreviewScreen
                field={activeField}
                routePattern={routePattern}
                machineWidthCm={machineWidthCm}
                headlandWidthM={headlandWidthM}
                orientationDeg={orientationDeg}
                onApprove={() => {
                  setProgressPct(0);
                  setElapsedSec(0);
                  setTractorStep(0);
                  setMissionStatus('READY');
                  setScreen('execution');
                }}
                onBack={() => setScreen('plantingSettings')}
              />
            )}

            {screen === 'execution' && (
              <ExecutionScreen
                field={activeField}
                routePattern={routePattern}
                status={missionStatus}
                progressPct={progressPct}
                elapsedSec={elapsedSec}
                tractorStep={tractorStep}
                batteryPct={batteryPct}
                speedMps={speedMps}
                formatTimer={formatTimer}
                onStart={() => setMissionStatus('RUNNING')}
                onPause={() => setMissionStatus('PAUSED')}
                onResume={() => setMissionStatus('RUNNING')}
                onStop={() => setMissionStatus('STOPPED')}
                onEmergencyStop={() => setMissionStatus('STOPPED')}
                onExit={() => setScreen('dashboard')}
                onFinish={() => setScreen('history')}
              />
            )}

            {screen === 'manualControl' && (
              <ManualControlScreen onBack={() => setScreen('dashboard')} />
            )}

            {screen === 'fields' && (
              <FieldsListScreen
                fields={fields}
                onSelectField={(id) => { setSelectedFieldId(id); setScreen('dashboard'); }}
                onCreateNew={() => setScreen('fieldCreate')}
                onBack={() => setScreen('dashboard')}
              />
            )}

            {screen === 'fieldCreate' && (
              <FieldCreateScreen
                onSave={(newField) => {
                  setFields([...fields, newField]);
                  setSelectedFieldId(newField.id);
                  setScreen('fields');
                }}
                onBack={() => setScreen('fields')}
              />
            )}

            {screen === 'history' && (
              <HistoryScreen missions={missions} onBack={() => setScreen('dashboard')} />
            )}

            {screen === 'settings' && (
              <SettingsScreen onBack={() => setScreen('dashboard')} />
            )}
          </div>

          {/* Bottom Tab Bar (Visible on primary screens) */}
          {['dashboard', 'fields', 'history', 'settings'].includes(screen) && (
            <div className="bg-[#172417] border-t border-emerald-950/80 px-4 py-2 flex justify-around items-center">
              <button
                onClick={() => setScreen('dashboard')}
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition ${
                  screen === 'dashboard' ? 'text-emerald-400 font-bold bg-emerald-950/60' : 'text-slate-400'
                }`}
              >
                <span className="text-lg">🏠</span>
                <span className="text-[11px]">Beranda</span>
              </button>

              <button
                onClick={() => setScreen('fields')}
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition ${
                  screen === 'fields' ? 'text-emerald-400 font-bold bg-emerald-950/60' : 'text-slate-400'
                }`}
              >
                <span className="text-lg">🌾</span>
                <span className="text-[11px]">Sawah</span>
              </button>

              <button
                onClick={() => setScreen('history')}
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition ${
                  screen === 'history' ? 'text-emerald-400 font-bold bg-emerald-950/60' : 'text-slate-400'
                }`}
              >
                <span className="text-lg">📊</span>
                <span className="text-[11px]">Riwayat</span>
              </button>

              <button
                onClick={() => setScreen('settings')}
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition ${
                  screen === 'settings' ? 'text-emerald-400 font-bold bg-emerald-950/60' : 'text-slate-400'
                }`}
              >
                <span className="text-lg">⚙️</span>
                <span className="text-[11px]">Pengaturan</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    // ── SCREEN 1: DASHBOARD ───────────────────────────────────────────
    function DashboardScreen({ fields, activeField, selectedFieldId, setSelectedFieldId, batteryPct, onStartMission, onManualControl, onViewHistory, onNavigate }) {
      return (
        <div className="p-4 space-y-4">
          {/* Top Header */}
          <div className="flex justify-between items-center bg-[#1A2A1A] p-3.5 rounded-2xl border border-emerald-900/40">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-emerald-600/20 border border-emerald-500/40 flex items-center justify-center text-xl">
                🤖
              </div>
              <div>
                <h1 className="font-extrabold text-base tracking-tight text-white">Smart Rice Planter</h1>
                <div className="flex items-center gap-1.5 mt-0.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-[11px] font-semibold text-emerald-400">Connected (WiFi / ESP32)</span>
                </div>
              </div>
            </div>
            <span className="text-xs bg-emerald-900/60 text-emerald-300 font-bold px-2.5 py-1 rounded-lg border border-emerald-700/40">
              v1.4
            </span>
          </div>

          {/* Machine Telemetry Quick Cards */}
          <div className="grid grid-cols-4 gap-2">
            <div className="bg-[#182618] p-2.5 rounded-xl border border-emerald-900/40 text-center">
              <div className="text-xs text-slate-400 font-medium">Baterai</div>
              <div className="text-base font-extrabold text-emerald-400 mt-0.5">{batteryPct}%</div>
            </div>
            <div className="bg-[#182618] p-2.5 rounded-xl border border-emerald-900/40 text-center">
              <div className="text-xs text-slate-400 font-medium">GPS</div>
              <div className="text-base font-extrabold text-emerald-400 mt-0.5">RTK</div>
            </div>
            <div className="bg-[#182618] p-2.5 rounded-xl border border-emerald-900/40 text-center">
              <div className="text-xs text-slate-400 font-medium">Kecepatan</div>
              <div className="text-base font-extrabold text-white mt-0.5">0.8 <span className="text-[10px]">m/s</span></div>
            </div>
            <div className="bg-[#182618] p-2.5 rounded-xl border border-emerald-900/40 text-center">
              <div className="text-xs text-slate-400 font-medium">Mode</div>
              <div className="text-base font-extrabold text-amber-400 mt-0.5">AUTO</div>
            </div>
          </div>

          {/* Active Field Card */}
          <div className="bg-gradient-to-br from-[#1b2b1b] to-[#142014] p-4 rounded-2xl border border-emerald-800/40 shadow-lg relative overflow-hidden">
            <div className="flex justify-between items-start">
              <div>
                <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">Sawah Terpilih</span>
                <h2 className="text-xl font-extrabold text-white mt-1">{activeField?.name}</h2>
                <p className="text-xs text-slate-300 mt-1 font-medium">
                  {activeField?.areaM2} m² luas • {activeField?.boundary.length} titik batas
                </p>
              </div>
              <button
                onClick={() => onNavigate('fields')}
                className="bg-emerald-800/40 hover:bg-emerald-800/60 text-emerald-300 text-xs font-bold py-1.5 px-3 rounded-xl border border-emerald-600/40 transition"
              >
                Ganti 🔄
              </button>
            </div>
          </div>

          {/* Quick Action Buttons */}
          <div className="space-y-2.5 pt-1">
            <button
              onClick={onStartMission}
              className="w-full py-4 px-4 bg-emerald-500 hover:bg-emerald-400 active:scale-[0.99] text-emerald-950 font-extrabold text-base rounded-2xl shadow-lg shadow-emerald-950/60 flex items-center justify-center gap-2 transition"
            >
              <span className="text-xl">🌾</span> MULAI MISI BARU
            </button>

            <div className="grid grid-cols-2 gap-2.5">
              <button
                onClick={onManualControl}
                className="py-3 px-3 bg-[#1e2e1e] hover:bg-[#253925] border border-emerald-800/50 text-white font-bold text-sm rounded-xl flex items-center justify-center gap-2 transition"
              >
                <span>🕹️</span> Kontrol Manual
              </button>

              <button
                onClick={() => onNavigate('fields')}
                className="py-3 px-3 bg-[#1e2e1e] hover:bg-[#253925] border border-emerald-800/50 text-white font-bold text-sm rounded-xl flex items-center justify-center gap-2 transition"
              >
                <span>🗺️</span> Pemetaan Sawah
              </button>
            </div>
          </div>

          {/* Last Mission Summary */}
          <div className="bg-[#182618] p-3.5 rounded-2xl border border-emerald-900/40">
            <div className="flex justify-between items-center">
              <span className="text-xs font-bold text-slate-400">Riwayat Terakhir</span>
              <span className="text-[10px] bg-emerald-950 text-emerald-400 font-bold px-2 py-0.5 rounded border border-emerald-800/40">SELESAI</span>
            </div>
            <div className="mt-2 text-sm font-bold text-white">Misi Sawah Utama #27/8</div>
            <div className="text-xs text-slate-400 mt-0.5">1.240 m² tertanam • Cakupan 98%</div>
          </div>
        </div>
      );
    }

    // ── SCREEN 2: PLANTING SETTINGS ───────────────────────────────────
    function PlantingSettingsScreen({
      fields, selectedField, selectedFieldId, onSelectField,
      routePattern, setRoutePattern,
      rowSpacingCm, setRowSpacingCm,
      plantSpacingCm, setPlantSpacingCm,
      machineWidthCm, setMachineWidthCm,
      speedMps, setSpeedMps,
      headlandWidthM, setHeadlandWidthM,
      orientationDeg, setOrientationDeg,
      onGenerate, onBack
    }) {
      return (
        <div className="p-4 space-y-4 pb-12">
          {/* Header */}
          <div className="flex items-center gap-3">
            <button onClick={onBack} className="w-9 h-9 rounded-xl bg-[#1c2b1c] flex items-center justify-center text-slate-300 font-bold">
              ←
            </button>
            <h1 className="text-lg font-extrabold text-white">Pengaturan Tanam</h1>
          </div>

          {/* 1. Field Selector Carousel */}
          <div>
            <div className="flex justify-between items-center mb-2">
              <span className="text-xs font-bold text-slate-300">🌾 Sawah yang Dipilih</span>
            </div>
            <div className="flex gap-2 overflow-x-auto pb-1 hide-scrollbar">
              {fields.map(f => {
                const isSelected = f.id === selectedFieldId;
                return (
                  <div
                    key={f.id}
                    onClick={() => onSelectField(f.id)}
                    className={`min-w-[160px] p-3 rounded-2xl border cursor-pointer transition ${
                      isSelected
                        ? 'bg-[#203320] border-emerald-500 shadow-md'
                        : 'bg-[#162216] border-emerald-950'
                    }`}
                  >
                    <div className="flex justify-between items-center">
                      <span className="text-xl">🌾</span>
                      {isSelected && <span className="text-[10px] bg-emerald-500 text-emerald-950 font-extrabold px-1.5 py-0.5 rounded">✓ AKTIF</span>}
                    </div>
                    <div className="font-extrabold text-sm text-white mt-2">{f.name}</div>
                    <div className="text-[11px] text-slate-400 mt-0.5">{f.areaM2} m² • {f.boundary.length} titik</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* 2. Route Pattern Selector (4 Options) */}
          <div>
            <span className="text-xs font-bold text-slate-300">🛣️ Pola Jalur Tanam (Coverage Path Planning)</span>
            <div className="space-y-2 mt-2">
              {/* Pattern 1 */}
              <div
                onClick={() => setRoutePattern('BOUSTROPHEDON')}
                className={`p-3 rounded-2xl border cursor-pointer flex items-center justify-between transition ${
                  routePattern === 'BOUSTROPHEDON' ? 'bg-[#203320] border-emerald-500' : 'bg-[#162216] border-emerald-950'
                }`}
              >
                <div className="flex items-center gap-3">
                  <span className="text-2xl">⚡</span>
                  <div>
                    <div className="font-extrabold text-sm text-white">1. Persegi Panjang / Zig-Zag</div>
                    <div className="text-[11px] text-slate-400">Pola paralel bolak-balik standar & paling cepat</div>
                  </div>
                </div>
                {routePattern === 'BOUSTROPHEDON' && <span className="text-emerald-400 font-extrabold text-lg">✓</span>}
              </div>

              {/* Pattern 2 */}
              <div
                onClick={() => setRoutePattern('HEADLAND_INNER')}
                className={`p-3 rounded-2xl border cursor-pointer flex items-center justify-between transition ${
                  routePattern === 'HEADLAND_INNER' ? 'bg-[#203320] border-emerald-500' : 'bg-[#162216] border-emerald-950'
                }`}
              >
                <div className="flex items-center gap-3">
                  <span className="text-2xl">🔄</span>
                  <div>
                    <div className="font-extrabold text-sm text-white">2. Dengan Headland (Area Putar)</div>
                    <div className="text-[11px] text-slate-400">Tanam area tengah dulu, sisakan putaran di keliling ujung</div>
                  </div>
                </div>
                {routePattern === 'HEADLAND_INNER' && <span className="text-emerald-400 font-extrabold text-lg">✓</span>}
              </div>

              {/* Pattern 3 */}
              <div
                onClick={() => setRoutePattern('SPIRAL_INWARD')}
                className={`p-3 rounded-2xl border cursor-pointer flex items-center justify-between transition ${
                  routePattern === 'SPIRAL_INWARD' ? 'bg-[#203320] border-emerald-500' : 'bg-[#162216] border-emerald-950'
                }`}
              >
                <div className="flex items-center gap-3">
                  <span className="text-2xl">🌀</span>
                  <div>
                    <div className="font-extrabold text-sm text-white">3. Oval / Spiral (Pinggir ke Tengah)</div>
                    <div className="text-[11px] text-slate-400">Memutar mengelilingi batas sawah masuk menuju pusat</div>
                  </div>
                </div>
                {routePattern === 'SPIRAL_INWARD' && <span className="text-emerald-400 font-extrabold text-lg">✓</span>}
              </div>

              {/* Pattern 4 */}
              <div
                onClick={() => setRoutePattern('SPIRAL_OUTWARD')}
                className={`p-3 rounded-2xl border cursor-pointer flex items-center justify-between transition ${
                  routePattern === 'SPIRAL_OUTWARD' ? 'bg-[#203320] border-emerald-500' : 'bg-[#162216] border-emerald-950'
                }`}
              >
                <div className="flex items-center gap-3">
                  <span className="text-2xl">💫</span>
                  <div>
                    <div className="font-extrabold text-sm text-white">4. Oval / Spiral (Tengah ke Pinggir)</div>
                    <div className="text-[11px] text-slate-400">Mulai dari titik pusat tengah memutar ke arah luar</div>
                  </div>
                </div>
                {routePattern === 'SPIRAL_OUTWARD' && <span className="text-emerald-400 font-extrabold text-lg">✓</span>}
              </div>
            </div>

            {/* Dynamic Diagram Preview Component */}
            <div className="mt-3 p-3 bg-[#172517] rounded-2xl border border-emerald-900/60">
              <div className="text-xs font-bold text-emerald-400 mb-2 flex items-center gap-1.5">
                <span>📷</span> Skema Alur Jalur ({routePattern.replace('_', ' ')}):
              </div>
              <SVGPatternDiagram pattern={routePattern} />
            </div>
          </div>

          {/* 3. Parameter Form */}
          <div className="bg-[#182618] p-4 rounded-2xl border border-emerald-900/40 space-y-3">
            <span className="text-xs font-bold text-white uppercase tracking-wider">⚙️ Parameter Mesin & Tanam</span>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-semibold text-slate-300 block mb-1">Jarak Antar Baris</label>
                <div className="flex items-center bg-[#121c12] rounded-xl border border-emerald-900 px-3 py-2">
                  <input
                    type="number"
                    value={rowSpacingCm}
