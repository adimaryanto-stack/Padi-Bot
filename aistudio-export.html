<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PadiBot - Smart Rice Planter</title>
  <!-- Tailwind CSS & React 18 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8FAFC;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 flex justify-center items-center min-h-screen p-0 sm:p-4">
  <div id="root" class="w-full max-w-md bg-[#F8FAFC] min-h-screen sm:min-h-[880px] sm:h-[880px] sm:rounded-[36px] shadow-2xl overflow-hidden flex flex-col relative border border-slate-200"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Mock Data & Models ---
    const INITIAL_FIELDS = [
      {
        id: 'f1',
        name: 'Sawah Utama Karawang',
        areaM2: 1722,
        perimeterM: 168.4,
        boundary: [
          { lat: -6.923400, lon: 107.610000 },
          { lat: -6.923380, lon: 107.610420 },
          { lat: -6.923720, lon: 107.610440 },
          { lat: -6.923740, lon: 107.610020 }
        ]
      },
      {
        id: 'f2',
        name: 'Sawah Blok Timur',
        areaM2: 890,
        perimeterM: 122.0,
        boundary: [
          { lat: -6.923200, lon: 107.610100 },
          { lat: -6.923250, lon: 107.610450 },
          { lat: -6.923550, lon: 107.610450 },
          { lat: -6.923500, lon: 107.610100 }
        ]
      }
    ];

    const PATTERNS = [
      {
        id: 'BOUSTROPHEDON',
        title: '1. Persegi Panjang / Zig-Zag',
        desc: 'Pola bolak-balik paralel standar paling efisien untuk petakan kotak',
        emoji: '⚡'
      },
      {
        id: 'HEADLAND_INNER',
        title: '2. Dengan Headland (Area Putar)',
        desc: 'Tanam area tengah terlebih dahulu, sisakan putaran di keliling pematang',
        emoji: '🔄'
      },
      {
        id: 'SPIRAL_INWARD',
        title: '3. Oval / Spiral (Pinggir ke Tengah)',
        desc: 'Memutar mengelilingi batas sawah dari luar menuju titik tengah',
        emoji: '🌀'
      },
      {
        id: 'SPIRAL_OUTWARD',
        title: '4. Oval / Spiral (Tengah ke Pinggir)',
        desc: 'Mulai dari pusat tengah sawah memutar membesar ke arah luar',
        emoji: '💫'
      }
    ];

    function App() {
      const [currentScreen, setCurrentScreen] = useState('DASHBOARD');
      const [fields, setFields] = useState(INITIAL_FIELDS);
      const [selectedFieldId, setSelectedFieldId] = useState('f1');
      const [pattern, setPattern] = useState('BOUSTROPHEDON');
      const [machineWidth, setMachineWidth] = useState(1.5);
      const [headlandWidth, setHeadlandWidth] = useState(3.0);
      const [orientationDeg, setOrientationDeg] = useState(0);

      const [connectionMode, setConnectionMode] = useState('SIMULATOR');
      const [telemetry, setTelemetry] = useState({
        battery: 92,
        speed: 0.00,
        gpsStatus: 'GPS RTK',
        accuracy: 1.2,
        lat: -6.923500,
        lon: 107.610200,
        progress: 0,
        currentLane: 0,
        totalLanes: 18,
        areaDone: 0,
        areaRemaining: 1722
      });

      const [isMissionRunning, setIsMissionRunning] = useState(false);
      const [isPaused, setIsPaused] = useState(false);
      const [manualSpeed, setManualSpeed] = useState(50);
      const [newFieldName, setNewFieldName] = useState('');
      const [newFieldPoints, setNewFieldPoints] = useState([
        { lat: -6.923400, lon: 107.610000 },
        { lat: -6.923380, lon: 107.610420 },
        { lat: -6.923720, lon: 107.610440 },
        { lat: -6.923740, lon: 107.610020 }
      ]);
      const [walkMapActive, setWalkMapActive] = useState(false);

      const activeField = useMemo(() => {
        return fields.find(f => f.id === selectedFieldId) || fields[0];
      }, [fields, selectedFieldId]);

      // Simulation loop
      useEffect(() => {
        let interval;
        if (isMissionRunning && !isPaused) {
          interval = setInterval(() => {
            setTelemetry(prev => {
              const newProgress = Math.min(100, prev.progress + 1.5);
              const done = Math.round((newProgress / 100) * (activeField.areaM2 || 1722));
              const rem = Math.max(0, (activeField.areaM2 || 1722) - done);
              const lane = Math.min(prev.totalLanes, Math.floor((newProgress / 100) * prev.totalLanes) + 1);

              if (newProgress >= 100) {
                setIsMissionRunning(false);
              }

              return {
                ...prev,
                progress: newProgress,
                speed: 0.50,
                battery: Math.max(15, prev.battery - 0.05),
                currentLane: lane,
                areaDone: done,
                areaRemaining: rem
              };
            });
          }, 1000);
        } else if (!isMissionRunning) {
          setTelemetry(prev => ({ ...prev, speed: 0.00 }));
        }
        return () => clearInterval(interval);
      }, [isMissionRunning, isPaused, activeField]);

      return (
        <div className="flex flex-col h-full bg-[#F8FAFC] relative select-none">
          {/* Main Content Area */}
          <div className="flex-1 overflow-y-auto hide-scrollbar pb-20">
            {currentScreen === 'DASHBOARD' && (
              <DashboardView
                activeField={activeField}
                fields={fields}
                telemetry={telemetry}
                onStartMission={() => setCurrentScreen('PLANTING_SETTINGS')}
                onManualControl={() => setCurrentScreen('MANUAL_CONTROL')}
                onOpenFields={() => setCurrentScreen('FIELD_LIST')}
                onSelectFieldId={setSelectedFieldId}
              />
            )}

            {currentScreen === 'PLANTING_SETTINGS' && (
              <PlantingSettingsView
                activeField={activeField}
                fields={fields}
                selectedFieldId={selectedFieldId}
                setSelectedFieldId={setSelectedFieldId}
                pattern={pattern}
                setPattern={setPattern}
                machineWidth={machineWidth}
                setMachineWidth={setMachineWidth}
                headlandWidth={headlandWidth}
                setHeadlandWidth={setHeadlandWidth}
                orientationDeg={orientationDeg}
                setOrientationDeg={setOrientationDeg}
                onNext={() => setCurrentScreen('ROUTE_PREVIEW')}
                onBack={() => setCurrentScreen('DASHBOARD')}
              />
            )}

            {currentScreen === 'ROUTE_PREVIEW' && (
              <RoutePreviewView
                activeField={activeField}
                pattern={pattern}
                machineWidth={machineWidth}
                headlandWidth={headlandWidth}
                orientationDeg={orientationDeg}
                onApprove={() => {
                  setTelemetry(prev => ({ ...prev, progress: 0, areaDone: 0, areaRemaining: activeField.areaM2 }));
                  setIsMissionRunning(true);
                  setIsPaused(false);
                  setCurrentScreen('EXECUTION');
                }}
                onBack={() => setCurrentScreen('PLANTING_SETTINGS')}
              />
            )}

            {currentScreen === 'EXECUTION' && (
              <ExecutionView
                activeField={activeField}
                pattern={pattern}
                telemetry={telemetry}
                isMissionRunning={isMissionRunning}
                isPaused={isPaused}
                onPause={() => setIsPaused(true)}
                onResume={() => setIsPaused(false)}
                onStop={() => {
                  setIsMissionRunning(false);
                  setCurrentScreen('DASHBOARD');
                }}
                onEmergencyStop={() => {
                  setIsMissionRunning(false);
                  alert('⚠️ BERHENTI DARURAT DIAKTIFKAN!');
                  setCurrentScreen('DASHBOARD');
                }}
                onBack={() => setCurrentScreen('DASHBOARD')}
              />
            )}

            {currentScreen === 'MANUAL_CONTROL' && (
              <ManualControlView
                telemetry={telemetry}
                manualSpeed={manualSpeed}
                setManualSpeed={setManualSpeed}
                onClose={() => setCurrentScreen('DASHBOARD')}
              />
            )}

            {currentScreen === 'FIELD_LIST' && (
              <FieldListView
                fields={fields}
                selectedFieldId={selectedFieldId}
                onSelect={(id) => {
                  setSelectedFieldId(id);
                  setCurrentScreen('DASHBOARD');
                }}
                onAddNew={() => setCurrentScreen('FIELD_CREATE')}
                onBack={() => setCurrentScreen('DASHBOARD')}
              />
            )}

            {currentScreen === 'FIELD_CREATE' && (
              <FieldCreateView
                fieldName={newFieldName}
                setFieldName={setNewFieldName}
                points={newFieldPoints}
                setPoints={setNewFieldPoints}
                walkMapActive={walkMapActive}
                setWalkMapActive={setWalkMapActive}
                telemetry={telemetry}
                onSave={(field) => {
                  setFields(prev => [field, ...prev]);
                  setSelectedFieldId(field.id);
                  setCurrentScreen('DASHBOARD');
                }}
                onBack={() => setCurrentScreen('FIELD_LIST')}
              />
            )}

            {currentScreen === 'HISTORY' && (
              <HistoryView onBack={() => setCurrentScreen('DASHBOARD')} />
            )}

            {currentScreen === 'SETTINGS' && (
              <SettingsView
                connectionMode={connectionMode}
                setConnectionMode={setConnectionMode}
                onBack={() => setCurrentScreen('DASHBOARD')}
              />
            )}
          </div>

          {/* Bottom Navigation Bar */}
          {['DASHBOARD', 'FIELD_LIST', 'HISTORY', 'SETTINGS'].includes(currentScreen) && (
            <div className="absolute bottom-0 inset-x-0 bg-white border-t border-slate-200 px-6 py-2.5 flex justify-between items-center z-30 shadow-lg">
              <button
                onClick={() => setCurrentScreen('DASHBOARD')}
                className={`flex flex-col items-center gap-1 ${currentScreen === 'DASHBOARD' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
              >
                <span className="text-xl">🏠</span>
                <span className="text-[11px]">Beranda</span>
              </button>
              <button
                onClick={() => setCurrentScreen('FIELD_LIST')}
                className={`flex flex-col items-center gap-1 ${currentScreen === 'FIELD_LIST' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
              >
                <span className="text-xl">🌾</span>
                <span className="text-[11px]">Pemetaan</span>
              </button>
              <button
                onClick={() => setCurrentScreen('HISTORY')}
                className={`flex flex-col items-center gap-1 ${currentScreen === 'HISTORY' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
              >
                <span className="text-xl">📊</span>
                <span className="text-[11px]">Laporan</span>
              </button>
              <button
                onClick={() => setCurrentScreen('SETTINGS')}
                className={`flex flex-col items-center gap-1 ${currentScreen === 'SETTINGS' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
              >
                <span className="text-xl">⚙️</span>
                <span className="text-[11px]">Pengaturan</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    // --- SCREEN 1: DASHBOARD VIEW (LIGHT THEME MATCHING AI STUDIO) ---
    function DashboardView({ activeField, fields, telemetry, onStartMission, onManualControl, onOpenFields, onSelectFieldId }) {
      return (
        <div className="p-4 space-y-4">
          {/* Top Header */}
          <div className="flex justify-between items-center pt-2">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">PadiBot</h1>
              <p className="text-xs text-slate-500">Tanam Cerdas, Panen Lebih 🌾</p>
            </div>
            <div className="flex items-center gap-1.5 px-3 py-1 bg-emerald-100 border border-emerald-300 rounded-full text-emerald-800 text-xs font-semibold">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>Simulator Aktif</span>
            </div>
          </div>

          {/* Hero Banner */}
          <div className="relative rounded-2xl overflow-hidden shadow-sm border border-slate-200 aspect-[16/8]">
            <img
              src="https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=800&q=80"
              alt="Rice Field Banner"
              className="w-full h-full object-cover"
            />
            <div className="absolute inset-0 bg-gradient-to-t from-black/75 via-black/25 to-transparent flex flex-col justify-end p-4 text-white">
              <h2 className="text-lg font-bold">PadiBot Smart Planter</h2>
              <p className="text-xs text-slate-200">Presisi Penanaman Bibit Padi Otomatis & Efisien</p>
            </div>
          </div>

          {/* Status Mesin Tanam Card */}
          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-slate-800 text-sm">Status Mesin Tanam</h3>
              <span className="px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold font-mono">
                {telemetry.gpsStatus} (±{telemetry.accuracy}m)
              </span>
            </div>

            <div className="grid grid-cols-3 gap-2 pt-1">
              <div className="bg-slate-50 rounded-xl p-3 border border-slate-100 text-center">
                <span className="text-lg text-emerald-600 block">🔋</span>
                <span className="text-base font-extrabold text-slate-900 block mt-0.5">{telemetry.battery}%</span>
                <span className="text-[10px] text-slate-500">Baterai Mesin</span>
              </div>
              <div className="bg-slate-50 rounded-xl p-3 border border-slate-100 text-center">
                <span className="text-lg text-sky-600 block">⚡</span>
                <span className="text-base font-extrabold text-slate-900 block mt-0.5">{telemetry.speed.toFixed(2)} m/s</span>
                <span className="text-[10px] text-slate-500">Kecepatan</span>
              </div>
              <div className="bg-slate-50 rounded-xl p-3 border border-slate-100 text-center">
                <span className="text-lg text-amber-600 block">📶</span>
                <span className="text-base font-extrabold text-slate-900 block mt-0.5">Simulator</span>
                <span className="text-[10px] text-slate-500">Mode Komunikasi</span>
              </div>
            </div>
          </div>

          {/* Sawah Aktif Card */}
          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-1.5 text-xs text-slate-500 font-semibold">
                <span>🌾</span>
                <span>Sawah Aktif</span>
              </div>
              <button onClick={onOpenFields} className="text-xs font-bold text-emerald-600 hover:text-emerald-700">
                Ganti Sawah →
              </button>
            </div>

            <div>
              <h4 className="text-base font-extrabold text-slate-900">{activeField.name}</h4>
              <p className="text-xs text-slate-500 mt-0.5">
                📐 Luas: <span className="font-bold text-emerald-700">{activeField.areaM2} m²</span> • 📍 {activeField.boundary.length} Titik Batas
              </p>
            </div>

            {/* Map Preview Graphic */}
            <div className="relative bg-[#1E2D1E] rounded-xl overflow-hidden h-36 border border-emerald-900/30 flex items-center justify-center p-3">
              <svg viewBox="0 0 300 140" className="w-full h-full">
                <polygon points="40,20 260,30 240,120 60,110" fill="#00E676" fillOpacity="0.2" stroke="#00E676" strokeWidth="2.5" />
                <line x1="60" y1="45" x2="240" y2="48" stroke="#00E676" strokeWidth="1.5" strokeDasharray="3 3" />
                <line x1="60" y1="70" x2="240" y2="73" stroke="#00E676" strokeWidth="1.5" strokeDasharray="3 3" />
                <line x1="60" y1="95" x2="240" y2="98" stroke="#00E676" strokeWidth="1.5" strokeDasharray="3 3" />
                <circle cx="40" cy="20" r="5" fill="#10B981" />
                <text x="48" y="24" fill="#FFFFFF" fontSize="9" fontWeight="bold">START</text>
                <circle cx="60" cy="110" r="5" fill="#EF4444" />
                <text x="68" y="114" fill="#FFFFFF" fontSize="9" fontWeight="bold">END</text>
              </svg>
            </div>
          </div>

          {/* Big Green Start Mission Button */}
          <button
            onClick={onStartMission}
            className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-extrabold text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/25 active:scale-[0.99] transition-all"
          >
            <span>🌾</span>
            <span>MULAI MISI BARU</span>
          </button>

          {/* Quick Actions */}
          <div className="grid grid-cols-2 gap-3">
            <button
              onClick={onManualControl}
              className="py-3 bg-white hover:bg-slate-50 border border-slate-200 text-slate-800 rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-sm"
            >
              <span>🕹️</span>
              <span>Kontrol Manual</span>
            </button>
            <button
              onClick={onOpenFields}
              className="py-3 bg-white hover:bg-slate-50 border border-slate-200 text-slate-800 rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-sm"
            >
              <span>🗺️</span>
              <span>Peta Sawah</span>
            </button>
          </div>

          {/* Last Mission Card */}
          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-1">
            <div className="flex justify-between items-center">
              <span className="text-[11px] font-semibold text-slate-500">Misi Terakhir</span>
              <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold">SELESAI</span>
            </div>
            <h5 className="font-bold text-slate-800 text-sm">Misi Penanaman Ciherang #1</h5>
            <p className="text-xs text-slate-500">Cakupan: 96.5% • 22 Jalur • 18 Menit</p>
          </div>
        </div>
      );
    }

    // --- SCREEN 2: PLANTING SETTINGS VIEW ---
    function PlantingSettingsView({
      activeField, fields, selectedFieldId, setSelectedFieldId,
      pattern, setPattern, machineWidth, setMachineWidth,
      headlandWidth, setHeadlandWidth, orientationDeg, setOrientationDeg,
      onNext, onBack
    }) {
      return (
        <div className="p-4 space-y-4">
          <div className="flex items-center gap-3 pt-2">
            <button onClick={onBack} className="w-8 h-8 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 font-bold">
              ←
            </button>
            <div>
              <h1 className="text-xl font-extrabold text-slate-900">Pengaturan Tanam</h1>
              <p className="text-xs text-slate-500">Langkah 1 dari 3: Konfigurasi Lintasan</p>
            </div>
          </div>

          {/* 1. Field Selector */}
          <div className="space-y-2">
            <label className="text-xs font-bold text-slate-700 block">Pilih Sawah yang Dikerjakan:</label>
            <div className="flex gap-2 overflow-x-auto pb-1 hide-scrollbar">
              {fields.map(f => {
                const isSelected = f.id === selectedFieldId;
                return (
                  <div
                    key={f.id}
                    onClick={() => setSelectedFieldId(f.id)}
                    className={`min-w-[180px] p-3 rounded-2xl border cursor-pointer transition-all ${isSelected ? 'bg-emerald-50 border-emerald-600 shadow-sm' : 'bg-white border-slate-200'}`}
                  >
                    <div className="flex justify-between items-center">
                      <span className="font-bold text-xs text-slate-900 truncate">{f.name}</span>
                      {isSelected && <span className="text-[10px] px-1.5 py-0.5 bg-emerald-600 text-white rounded font-bold">Aktif</span>}
                    </div>
                    <p className="text-[11px] text-slate-500 mt-1">{f.areaM2} m² • {f.boundary.length} Titik</p>
                  </div>
                );
              })}
            </div>
          </div>

          {/* 2. Route Pattern Selection (4 Options) */}
          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
            <h3 className="font-bold text-slate-900 text-sm">Pola Jalur Tanam (Coverage Path)</h3>
            <div className="space-y-2">
              {PATTERNS.map(p => {
                const isSelected = p.id === pattern;
                return (
                  <div
                    key={p.id}
                    onClick={() => setPattern(p.id)}
                    className={`p-3 rounded-xl border cursor-pointer flex items-start gap-3 transition-all ${isSelected ? 'bg-emerald-50 border-emerald-600 ring-1 ring-emerald-600' : 'bg-slate-50 border-slate-200'}`}
                  >
                    <input type="radio" checked={isSelected} readOnly className="mt-1 accent-emerald-600" />
                    <div>
                      <h4 className="text-xs font-bold text-slate-900">{p.emoji} {p.title}</h4>
                      <p className="text-[11px] text-slate-500 mt-0.5 leading-snug">{p.desc}</p>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Dynamic Visual Schematic Diagram */}
            <div className="bg-[#1E2D1E] rounded-xl p-3 border border-emerald-950 text-white space-y-2">
              <div className="flex justify-between items-center text-[10px] font-mono">
                <span className="text-emerald-400 font-bold">● START (Masuk)</span>
                <span className="text-rose-400 font-bold">■ END (Keluar)</span>
              </div>
              <div className="h-20 bg-[#0F1A0F] rounded-lg border border-emerald-900/50 flex items-center justify-center p-2 text-center">
                <span className="text-xs text-emerald-400 font-mono font-bold leading-relaxed">
                  {pattern === 'BOUSTROPHEDON' && '═► ═► Jalur Paralel Zig-Zag Bolak-Balik ◄═ ◄═'}
                  {pattern === 'HEADLAND_INNER' && '▓▓ [Area Tengah Terlebih Dahulu] ──► [Keliling Headland Terluar]'}
                  {pattern === 'SPIRAL_INWARD' && '◎ Spiral Inward: [Sudut Terluar] ──► [Pusat Tengah Sawah]'}
                  {pattern === 'SPIRAL_OUTWARD' && '◉ Spiral Outward: [Pusat Tengah] ──► [Batas Luar Sawah]'}
                </span>
              </div>
              <div className="flex gap-4 text-[9px] text-slate-300">
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm bg-[#00E676]"></span> Jalur Tanam</span>
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm bg-[#FFD54F]"></span> Area Putar</span>
              </div>
            </div>
          </div>

          {/* 3. Parameters Sliders */}
          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-4">
            <div>
              <div className="flex justify-between text-xs font-bold">
                <span className="text-slate-700">Lebar Kerja Mesin (W):</span>

    // --- SCREEN 4: EXECUTION VIEW (MODE OTOMATIS LIVE) ---

              </button>

            >

            </button>
          </div>
        </div>

              ✕
            </button>
          </div>

          {/* D-Pad Layout */}
          <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col items-center justify-center space-y-4">
            <button
              onMouseDown={() => setPressedDir('UP')}
              onMouseUp={() => setPressedDir(null)}
              className={`w-20 h-20 rounded-2xl border-2 flex flex-col items-center justify-center font-bold transition-all ${pressedDir === 'UP' ? 'bg-emerald-600 text-white border-emerald-700 scale-95' : 'bg-emerald-50 text-emerald-800 border-emerald-600 shadow-md'}`}

              <span className="text-2xl">▲</span>
              <span className="text-[10px]">MAJU</span>

            <div className="flex gap-6 items-center">

              >
                <span className="text-2xl">◀</span>
                <span className="text-[10px]">KIRI</span>
              </button>
              <div className="w-14 h-14 rounded-full bg-slate-100 border border-slate-300 flex items-center justify-center text-lg">
                🤖
              </div>
              <button
                onMouseDown={() => setPressedDir('RIGHT')}
                onMouseUp={() => setPressedDir(null)}
                className={`w-20 h-20 rounded-2xl border-2 flex flex-col items-center justify-center font-bold transition-all ${pressedDir === 'RIGHT' ? 'bg-emerald-600 text-white border-emerald-700 scale-95' : 'bg-emerald-50 text-emerald-800 border-emerald-600 shadow-md'}`}
              >
                <span className="text-2xl">▶</span>
                <span className="text-[10px]">KANAN</span>
              </button>
            </div>

            <button
              onMouseDown={() => setPressedDir('DOWN')}
              onMouseUp={() => setPressedDir(null)}
              className={`w-20 h-20 rounded-2xl border-2 flex flex-col items-center justify-center font-bold transition-all ${pressedDir === 'DOWN' ? 'bg-emerald-600 text-white border-emerald-700 scale-95' : 'bg-emerald-50 text-emerald-800 border-emerald-600 shadow-md'}`}
            >
              <span className="text-2xl">▼</span>

            <div className="grid grid-cols-3 gap-2 pt-1">

            </div>
          </div>
        </div>
      );

                <div

                  className={`p-4 rounded-2xl border cursor-pointer transition-all ${isSelected ? 'bg-emerald-50 border-emerald-600 shadow-sm' : 'bg-white border-slate-200'}`}

                  <div className="flex justify-between items-start">
                    <div>
                      <h3 className="font-bold text-slate-900 text-base">{f.name}</h3>

                    </div>
                    {isSelected && (
                      <span className="px-2.5 py-1 bg-emerald-600 text-white rounded-full text-[10px] font-bold">
                        Aktif
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );

    // --- SCREEN 7: FIELD CREATE VIEW (AUTO-GPS & WALK AND MAP) ---
    function FieldCreateView({ fieldName, setFieldName, points, setPoints, walkMapActive, setWalkMapActive, telemetry, onSave, onBack }) {
      return (
        <div className="p-4 space-y-4">
          <div className="flex items-center gap-3 pt-2">
            <button onClick={onBack} className="w-8 h-8 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 font-bold">
              ←
            </button>
            <div>
              <h1 className="text-xl font-extrabold text-slate-900">Tambah Sawah Baru</h1>
              <p className="text-xs text-slate-500">Pemetaan Batas Koordinat GPS</p>
            </div>
          </div>

          <div className="space-y-3">
            <input
              type="text"
              placeholder="Nama Sawah (Contoh: Sawah Blok Barat)"
              value={fieldName}
              onChange={e => setFieldName(e.target.value)}

                <span className="font-bold text-slate-800 text-xs flex items-center gap-1">📍 Lokasi GPS Terkini</span>
                <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded">±1.2m Akurat</span>
              </div>
              <p className="text-xs font-mono text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100">
                Lat: {telemetry.lat.toFixed(6)}, Lon: {telemetry.lon.toFixed(6)}
              </p>
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={() => setPoints(prev => [...prev, { lat: telemetry.lat, lon: telemetry.lon }])}
                  className="py-2.5 bg-emerald-600 text-white rounded-xl font-bold text-xs"
                >
                  + Titik GPS Terkini
                </button>
                <button
                  onClick={() => setWalkMapActive(!walkMapActive)}
                  className={`py-2.5 border rounded-xl font-bold text-xs ${walkMapActive ? 'bg-emerald-100 border-emerald-600 text-emerald-800' : 'bg-white border-slate-200 text-slate-700'}`}

                  {walkMapActive ? '🚶 Selesai Rekam' : '🚶 Walk & Map'}
                </button>
              </div>
            </div>

            {/* Points List */}
            <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2">
              <span className="text-xs font-bold text-slate-800 block">Daftar Titik Batas ({points.length} Titik):</span>
              <div className="space-y-1.5 max-h-36 overflow-y-auto">
                {points.map((pt, idx) => (
                  <div key={idx} className="flex justify-between items-center text-xs font-mono bg-slate-50 p-2 rounded-lg border border-slate-100">
                    <span>Titik {idx + 1}: {pt.lat.toFixed(6)}, {pt.lon.toFixed(6)}</span>
                    <button onClick={() => setPoints(prev => prev.filter((_, i) => i !== idx))} className="text-rose-600 font-bold px-1.5">✕</button>
                  </div>
                ))}
              </div>
            </div>

            <button
              onClick={() => {
                if (!fieldName.trim()) return alert('Nama sawah wajib diisi!');
                onSave({
                  id: 'f_' + Date.now(),
                  name: fieldName,
                  areaM2: 1250,
                  perimeterM: 140.0,
                  boundary: points

              }}
              className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-extrabold text-base shadow-md"
            >
              Simpan Sawah
            </button>
          </div>
        </div>
      );
    }

              <div className="flex justify-between">

              </div>
              <p className="text-xs text-slate-500">27 Agustus 2026 • 1,722 m² tertanam (98%)</p>
            </div>
            <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-1">
              <div className="flex justify-between">
                <span className="font-bold text-slate-800 text-sm">Misi Sawah Timur #14</span>
                <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded">SELESAI</span>
              </div>
              <p className="text-xs text-slate-500">25 Agustus 2026 • 890 m² tertanam (97%)</p>

          </div>
        </div>
      );
    }

    // --- SCREEN 9: SETTINGS VIEW ---
    function SettingsView({ connectionMode, setConnectionMode, onBack }) {
      return (
        <div className="p-4 space-y-4">
          <h1 className="text-xl font-extrabold text-slate-900 pt-2">Pengaturan Aplikasi</h1>

          {/* Theme card */}
          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2">
            <h3 className="font-bold text-slate-800 text-sm">Tema Tampilan Aplikasi</h3>
            <div className="grid grid-cols-2 gap-2 pt-1">
              <div className="p-3 rounded-xl border-2 border-emerald-600 bg-emerald-50 text-center">

                <span className="text-xs font-bold text-emerald-900 block mt-1">Versi Light</span>
                <span className="text-[10px] text-emerald-700 font-semibold">Aktif (Default)</span>
              </div>
              <div className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-center opacity-60">
                <span className="text-xl block">🌙</span>
                <span className="text-xs font-bold text-slate-700 block mt-1">Versi Dark</span>
                <span className="text-[10px] text-slate-500">Mode Malam</span>
              </div>
            </div>
          </div>

          {/* Connection Mode */}
          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2">
            <h3 className="font-bold text-slate-800 text-sm">Mode Komunikasi Mesin</h3>
            <div className="space-y-1.5 text-xs font-bold text-slate-700">
              {['SIMULATOR', 'WIFI', 'BLUETOOTH', 'GSM'].map(m => (
                <label key={m} className="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer">
                  <input
                    type="radio" name="conn" checked={connectionMode === m}
                    onChange={() => setConnectionMode(m)}
                    className="accent-emerald-600"

                  <span>{m === 'SIMULATOR' ? '🧪 Simulator Virtual (Offline)' : m === 'WIFI' ? '📶 WiFi / ESP32 WebSocket' : m === 'BLUETOOTH' ? '🔵 Bluetooth HC-05' : '📡 GSM 4G (MQTT)'}</span>
                </label>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
